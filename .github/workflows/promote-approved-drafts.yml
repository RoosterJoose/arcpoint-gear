name: Promote approved inbox drafts

on:
  push:
    branches: [main]
    paths:
      - 'src/content-inbox/**/*.json'
      - 'scripts/publish-approved-draft.mjs'
      - 'scripts/validate-content-inbox.mjs'
      - 'package.json'
      - '.github/workflows/promote-approved-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:inbox
      - run: npm run publish:approved
      - name: Commit promoted articles
        run: |
          if git diff --quiet; then
            echo "No approved draft promotions to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/published package.json scripts/publish-approved-draft.mjs
          git commit -m "Promote approved inbox drafts"
          git push
